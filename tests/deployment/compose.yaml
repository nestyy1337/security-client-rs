services:
  gateway:
    image: ${GATEWAY_IMAGE:?}
    platform: linux/amd64
    networks: [default, access]
    ports: ["127.0.0.1:0:9200", "127.0.0.1:0:5601", "127.0.0.1:0:8080"]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    mem_limit: 64m
  elasticsearch:
    image: ${ES_IMAGE:?}
    platform: linux/amd64
    environment:
      discovery.type: single-node
      node.store.allow_mmap: "false"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.certificate: certs/server.crt
      xpack.security.http.ssl.key: certs/server.key
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ingest.geoip.downloader.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    volumes:
      - ${FIXTURE_DIR:?}/certs:/usr/share/elasticsearch/config/certs:ro
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 2g
  registry:
    image: ${EPR_IMAGE:?}
    platform: linux/amd64
    volumes:
      - ${FIXTURE_DIR:?}/packages:/packages/package-registry:ro
    mem_limit: 768m
  kibana:
    image: ${KIBANA_IMAGE:?}
    platform: linux/amd64
    environment:
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - ${FIXTURE_DIR:?}/certs:/certs:ro
      - ${FIXTURE_DIR:?}/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    mem_limit: 3g
  fleet-server:
    image: ${AGENT_IMAGE:?}
    platform: linux/amd64
    hostname: fixture-fleet-server
    environment:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_ELASTICSEARCH_HOST: https://elasticsearch:9200
      FLEET_SERVER_ELASTICSEARCH_CA: /certs/ca.crt
      FLEET_SERVER_SERVICE_TOKEN: ${FLEET_SERVICE_TOKEN:-not-provisioned}
      FLEET_SERVER_POLICY_ID: fixture-server
      FLEET_SERVER_CERT: /certs/server.crt
      FLEET_SERVER_CERT_KEY: /certs/server.key
      FLEET_URL: https://fleet-server:8220
      FLEET_CA: /certs/ca.crt
      STATE_PATH: /state
    volumes:
      - ${FIXTURE_DIR:?}/certs:/certs:ro
      - server-state:/state
    mem_limit: 768m
  agent:
    image: ${AGENT_IMAGE:?}
    platform: linux/amd64
    hostname: fixture-agent
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: https://fleet-server:8220
      FLEET_ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-not-provisioned}
      FLEET_CA: /certs/ca.crt
      STATE_PATH: /state
    volumes:
      - ${FIXTURE_DIR:?}/certs/ca.crt:/certs/ca.crt:ro
      - ${FIXTURE_DIR:?}/logs:/fixtures:ro
      - agent-state:/state
    mem_limit: 768m
networks:
  default:
    internal: true
  access:
volumes:
  es-data:
  server-state:
  agent-state:
