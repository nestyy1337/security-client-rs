global
    maxconn 128

defaults
    mode tcp
    timeout connect 5s
    timeout client 120s
    timeout server 120s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s

listen elasticsearch
    bind :9200
    server es elasticsearch:9200 check resolvers docker init-addr libc,none

listen kibana
    bind :5601
    server kb kibana:5601 check resolvers docker init-addr libc,none

listen registry
    bind :8080
    server epr registry:8080 check resolvers docker init-addr libc,none
