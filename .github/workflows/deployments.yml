name: Deployment compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # The latest patch of every supported minor.
        profile: [9.5.5-basic, 9.4.8-basic, 9.3.8-basic, 9.2.8-basic, 9.1.10-basic, 9.0.8-basic, 8.19.23-basic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      # Image extraction otherwise pushes the runner past Elasticsearch's disk watermark,
      # which blocks shard allocation.
      - name: Make room for deployment images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # branch=master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # tag=v10.3.3
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
      - name: Test deployment
        run: uv run python -u tests/deployment/run.py --profile '${{ matrix.profile }}' --artifacts '${{ runner.temp }}/deployment-results'
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: deployment-${{ matrix.profile }}
          path: ${{ runner.temp }}/deployment-results
          if-no-files-found: error
          retention-days: 14
