name: Check
on:
  push:
  pull_request:
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with PyYAML==6.0.3 --with openapi-schema-validator==0.9.0 --with jsonschema==4.26.0 python -m unittest discover -s tools -p 'test_*.py'
      - run: uv run tools/api_coverage.py --fetch --check
      - run: uv run tools/schema_contracts.py --fetch --check
      - run: uv run python -m unittest discover -s tests/deployment -p 'test_*.py'
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo test --locked --doc
      - run: cargo package --locked
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo test --locked --workspace --all-targets --all-features
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
