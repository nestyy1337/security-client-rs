[package]
name = "kibana-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async Kibana client for security operations and Fleet management"
license = "MIT OR Apache-2.0"

[features]
default = []
demo = ["dep:axum", "dep:tokio", "dep:tracing-subscriber"]

[dependencies]
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "kibana-rs-demo"
path = "demo/main.rs"
required-features = ["demo"]
