[package]
name = "kibana-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async Kibana client for security operations and Fleet management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nestyy1337/security-client-rs"
readme = "README.md"
keywords = ["kibana", "elastic", "siem", "security", "fleet"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src/**/*.rs", "/examples/**/*.rs", "/tests/*.rs", "/tests/common/*.rs", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[workspace]
members = ["demo"]

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http = "1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
url = "2"

[dev-dependencies]
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1", features = ["v4"] }
