[package]
name = "kibana-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async Kibana client for security operations and Fleet management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nestyy1337/security-client-rs"
readme = "README.md"
documentation = "https://docs.rs/kibana-rs"
keywords = ["kibana", "elastic", "siem", "security", "fleet"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src/**/*.rs", "/examples/**/*.rs", "/tests/*.rs", "/tests/common/*.rs", "/tests/fixtures/*.json", "/docs/*.md", "/README.md", "/CHANGELOG.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Debug events per request; see the README.
tracing = ["dep:tracing"]

[dependencies]
base64 = "0.22"
bytes = "1.7.1"
futures-util = "0.3.28"
http = "1.1"
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "stream"] }
serde = { version = "1.0.103", features = ["derive"] }
serde_json = "1.0.29"
serde_urlencoded = "0.7.1"
thiserror = "2.0.3"
tokio = { version = "1.28.1", features = ["time"] }
tracing = { version = "0.1.37", default-features = false, features = ["std"], optional = true }
url = "2.4"

# Raises lower bounds that dependencies under-specify, for the minimal-versions CI job.
# `cfg(any())` never matches, so these never build.
[target.'cfg(any())'.dependencies]
quinn = { version = "0.11.6", optional = true }

[dev-dependencies]
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.29"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "std"] }
tokio = { version = "1.28.1", features = ["macros", "rt-multi-thread", "net", "time", "fs", "io-util", "test-util"] }
uuid = { version = "1", features = ["v4"] }
