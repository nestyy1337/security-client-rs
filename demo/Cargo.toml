[package]
name = "kibana-rs-demo"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Browser workbench demonstrating kibana-rs against a dedicated Kibana stack"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "kibana-rs-demo"
path = "main.rs"

[dependencies]
axum = "0.8"
kibana-rs = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
